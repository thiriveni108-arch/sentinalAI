[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Explainable employee behaviour threat-detection prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pennylane>=0.43,<0.44",
  "qiskit>=2.2,<3",
  "qiskit-aer>=0.17,<1",
  "qiskit-machine-learning>=0.9,<1",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "streamlit>=1.33,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]
notebook = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_ai = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
